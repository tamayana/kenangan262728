<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tama & Yana</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f1e;color:white;font-family:sans-serif;min-height:100vh;padding:20px 15px;display:flex;flex-direction:column;align-items:center}
h1{font-family:'Times New Roman',serif;font-style:italic;font-weight:300;font-size:42px;margin-top:20px}
h1 span{color:#6da3ff}
.sub{letter-spacing:4px;font-size:11px;color:#8a9bb5;margin:8px 0 15px}
.badge{border:1px solid #22304d;background:#111a2e;border-radius:30px;padding:8px 18px;font-size:12px;color:#8a9bb5;margin-bottom:20px}
.badge b{color:white}
.player{width:100%;max-width:480px;background:#111a2e;border:1px solid #22304d;border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:18px}
.player img{width:48px;height:48px;border-radius:10px;object-fit:cover}
.player .info{flex:1}
.player .info strong{font-size:14px;display:block}
.player .info small{font-size:11px;color:#8a9bb5}
.player button{width:40px;height:40px;border-radius:50%;border:none;background:white;font-size:16px;cursor:pointer}
.tabs{width:100%;max-width:480px;display:flex;gap:10px;margin-bottom:18px}
.tabs button{flex:1;padding:12px;border-radius:12px;border:1px solid #22304d;background:#111a2e;color:#8a9bb5;font-weight:700;letter-spacing:2px;font-size:12px;cursor:pointer}
.tabs button.active{background:white;color:#0a0f1e;border-color:white}
.grid{width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#111a2e;border:1px solid #22304d;border-radius:18px;overflow:hidden;position:relative;aspect-ratio:4/5}
.card img,.card video{width:100%;height:100%;object-fit:cover;display:block}
.card .name{position:absolute;bottom:0;left:0;right:0;padding:8px;background:linear-gradient(transparent,rgba(0,0,0,0.8));font-size:10px;color:#6b7a94;word-break:break-all}
.card.play::after{content:'▶';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;background:rgba(0,0,0,0.5);border-radius:50%;display:grid;place-items:center;font-size:20px}
.surat-box{width:100%;max-width:480px;background:#111a2e;border:1px solid #22304d;border-radius:18px;padding:20px;white-space:pre-wrap;line-height:1.6}
.how{width:100%;max-width:480px;margin-top:18px;border:1px dashed #33405e;border-radius:14px;padding:14px;font-size:11px;color:#8a9bb5;line-height:1.5}
.footer{margin-top:20px;background:#d9dde6;color:#0a0f1e;border-radius:20px;padding:8px 18px;font-size:11px;font-weight:600}
</style>
</head>
<body>

<h1>Tama <span>&</span> Yana</h1>
<div class="sub">SEJAK 26 DESEMBER 2022</div>
<div class="badge" id="hari"></div>

<div class="player">
<img src="https://i.scdn.co/image/ab67616d0000b273d8d1c5f5d3e5e8e5c5d5e5e5" id="cover" alt="">
<div class="info"><strong>Bernadya - Satu Bulan</strong><small>Memutar... Bernadya - Satu Bulan 💙</small></div>
<button id="playBtn">⏸️</button>
<audio id="audio" loop src="satu-bulan.mp3"></audio>
</div>

<div class="tabs">
<button id="btnFoto" class="active" onclick="showTab('foto')">FOTO</button>
<button id="btnVideo" onclick="showTab('video')">VIDEO</button>
<button id="btnSurat" onclick="showTab('surat')">SURAT</button>
</div>

<div id="fotoGrid" class="grid"></div>
<div id="videoGrid" class="grid" style="display:none"></div>
<div id="suratBox" class="surat-box" style="display:none"></div>

<div class="how">
<b>CARA UPLOAD:</b><br>
1. Buka github.com/tamayana/kenangan262728 → folder foto/video → Add file → Upload → Commit<br>
2. Refresh web ini, foto langsung muncul abadi!
</div>

<div class="footer">tamayana.github.io</div>

<script>
// HITUNG HARI
let start = new Date('2022-12-26');
let now = new Date();
let diff = Math.floor((now - start)/(1000*60*60*24));
let tahun = Math.floor(diff/365);
let bulan = Math.floor((diff%365)/30);
document.getElementById('hari').innerHTML = `${diff} HARI • ${tahun} Tahun ${bulan} Bulan Bersama`;

// AUDIO
let audio = document.getElementById('audio');
let btn = document.getElementById('playBtn');
let playing = false;
btn.onclick = ()=>{
  if(playing){audio.pause();btn.textContent='▶️';playing=false}
  else{audio.play();btn.textContent='⏸️';playing=true}
}

// LOAD FOTO & VIDEO OTOMATIS DARI GITHUB API
async function loadGaleri(){
  let res = await fetch('https://api.github.com/repos/tamayana/kenangan262728/contents/foto');
  let files = await res.json();
  let grid = document.getElementById('fotoGrid');
  grid.innerHTML='';
  files.forEach(f=>{
    if(f.name.match(/\.(jpg|jpeg|png|heic)$/i)){
      grid.innerHTML+=`<div class="card"><img src="${f.download_url}" loading="lazy"><div class="name">${f.name}</div></div>`;
    }
  });
  let res2 = await fetch('https://api.github.com/repos/tamayana/kenangan262728/contents/video');
  let files2 = await res2.json();
  let grid2 = document.getElementById('videoGrid');
  grid2.innerHTML='';
  files2.forEach(f=>{
    if(f.name.match(/\.(mp4|mov|webm)$/i)){
      grid2.innerHTML+=`<div class="card play"><video src="${f.download_url}" preload="metadata" muted playsinline></video><div class="name">${f.name}</div></div>`;
    }
  });
}
loadGaleri();

// LOAD SURAT
async function loadSurat(){
  let r = await fetch('surat.json?v='+Date.now());
  let data = await r.json();
  let box = document.getElementById('suratBox');
  if(data.length>0){
    box.innerHTML=`<h3 style="margin-bottom:12px">${data[0].judul}</h3><p>${data[0].teks}</p>`;
  }
}
loadSurat();

function showTab(t){
  document.getElementById('fotoGrid').style.display = t==='foto'?'grid':'none';
  document.getElementById('videoGrid').style.display = t==='video'?'grid':'none';
  document.getElementById('suratBox').style.display = t==='surat'?'block':'none';
  document.getElementById('btnFoto').className = t==='foto'?'active':'';
  document.getElementById('btnVideo').className = t==='video'?'active':'';
  document.getElementById('btnSurat').className = t==='surat'?'active':'';
  if(t==='video'){
    document.querySelectorAll('#videoGrid video').forEach(v=>{
      v.addEventListener('loadedmetadata',()=>{v.currentTime=0.5});
    });
  }
}
</script>
</body>
</html>
